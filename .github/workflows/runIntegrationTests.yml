name: Run Integration Tests
env:
  INDEXER_URL: ${{ secrets.INDEXER_URL }}
  INDEXER_V2_URL: ${{ secrets.INDEXER_V2_BETA_URL }}
  IS_INTEGRATION_MODE: "true"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  test-ci:
    name: test
    timeout-minutes: 45
    runs-on: macos-latest-xlarge
    steps:
      - name: Verify running from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Error: This workflow must be run from the master branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - run: yarn
      - run: npx playwright install --with-deps chromium
      - run: yarn setup
      - run: yarn build:freighter-api
      - run: yarn build:extension
      - run: yarn test:ci
      - run: yarn test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: extension/test-results/
          retention-days: 5
